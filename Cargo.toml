[workspace]
resolver = "2"
members = ["crates/gateway", "crates/gateway-gui"]
# Patched dependencies, built but never tested or linted as ours.
exclude = ["vendor"]

# Shared across every workspace member (must live at the workspace root --
# Cargo ignores a `[profile.*]` table declared in a member's own Cargo.toml).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# A throwaway iteration build: same optimisation level, but thin LTO across
# 16 codegen units links in seconds rather than the release profile's
# single-threaded 1.5-2 minutes per binary. Output lands in
# `target/release-fast/`, so it never overwrites a real release build.
# `cargo build --profile release-fast`
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# librqbit 9.0.1 with a streaming bug fixed: pieces a player was waiting on
# were downloaded again and again, costing up to a third of the swarm's speed
# during seeks. See vendor/librqbit/VENDORED.md, including how to drop this.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
