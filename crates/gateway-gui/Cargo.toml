[package]
name = "streaming-gateway-gui"
version = "1.1.0"
edition = "2021"
description = "Local Stremio streaming gateway + GUI launcher to start/stop it"
license = "MIT"
repository = "https://github.com/AzizBahloul/local-real-debrid-alternative"
keywords = ["stremio", "streaming", "gui", "egui", "bittorrent"]
categories = ["gui", "multimedia"]

[[bin]]
name = "streaming-gateway-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29"
# Plain-HTTP polling of our own localhost /health -- no TLS stack needed at all.
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Timestamps the exported filename. Already built for the gateway crate.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The tray icon, over D-Bus (StatusNotifierItem). Pure Rust on purpose: the
# usual alternative pulls in libappindicator/GTK development packages, and
# needing a new system -dev package to build the launcher is exactly the kind
# of dependency this workspace has stayed clear of. "blocking" keeps it out of
# the way of egui's own loop -- the tray owns a thread, not a runtime we have
# to host.
ksni = { version = "0.3", default-features = false, features = ["tokio", "blocking"] }

# ---------------------------------------------------------------------------
# Packaging.
#
# Three manifests describe the same install: the `.deb` below, the `.rpm`
# after it, and `packaging/arch/PKGBUILD`. All four files land in the same
# freedesktop locations in every one of them, and `tests/packaging.rs` fails
# the build if they drift -- a package that installs the binary somewhere the
# `.desktop` entry does not point still installs cleanly and simply does
# nothing when clicked.
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "streaming-gateway"
maintainer = "mohamed aziz bahloul"
copyright = "2026, mohamed aziz bahloul"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A local, high-performance streaming gateway that turns a magnet link or \
BitTorrent info hash into a normal HTTP video stream (with seeking) for \
Stremio, VLC, browsers, phones, and smart TVs on the same network. This \
package installs both the gateway server and a GUI launcher to start/stop \
it from the desktop."""
section = "video"
priority = "optional"
# Both binaries + a desktop-menu entry, bundled from one .deb. The server
# binary is picked up from the *other* workspace member's build output --
# `cargo deb` runs the workspace build first, so it exists by the time this
# manifest's assets are collected.
#
# Destinations are spelled out in full rather than as a trailing-slash
# directory. cargo-deb accepts both and infers the basename from the source
# for the directory form, but that form cannot be compared against the rpm
# and PKGBUILD manifests, which have no such shorthand -- and the icon line
# already has to be explicit because it renames the file.
assets = [
    ["target/release/streaming-gateway-gui", "usr/bin/streaming-gateway-gui", "755"],
    ["target/release/streaming-gateway", "usr/bin/streaming-gateway", "755"],
    ["assets/streaming-gateway-gui.desktop", "usr/share/applications/streaming-gateway-gui.desktop", "644"],
    # /usr/share/pixmaps is read directly by icon lookup with no theme-cache
    # refresh required, so the menu/desktop icon is correct immediately after
    # install (unlike the hicolor theme tree, which needs `gtk-update-icon-cache`).
    ["assets/icon-256.png", "usr/share/pixmaps/streaming-gateway-gui.png", "644"],
]

# Fedora / RHEL / Rocky / Alma / Nobara / openSUSE, via `cargo generate-rpm`.
# Paths are relative to the workspace root, exactly like the deb assets above,
# because both packagers run from there.
[package.metadata.generate-rpm]
name = "streaming-gateway"
summary = "Local Stremio streaming gateway + GUI launcher"
# The binary links only libc, libm and libgcc_s (verified with ldd), all of
# which are part of any base install. Leaving auto-req on would make the
# package depend on whichever rpm find-requires helper the *build* machine
# has, which is the wrong machine to ask.
auto-req = "no"
assets = [
    { source = "target/release/streaming-gateway-gui", dest = "/usr/bin/streaming-gateway-gui", mode = "755" },
    { source = "target/release/streaming-gateway", dest = "/usr/bin/streaming-gateway", mode = "755" },
    { source = "crates/gateway-gui/assets/streaming-gateway-gui.desktop", dest = "/usr/share/applications/streaming-gateway-gui.desktop", mode = "644" },
    { source = "crates/gateway-gui/assets/icon-256.png", dest = "/usr/share/pixmaps/streaming-gateway-gui.png", mode = "644" },
]
