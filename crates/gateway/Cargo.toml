[package]
name = "streaming-gateway"
version = "0.4.0"
edition = "2021"
description = "Local high-performance Stremio streaming gateway (torrent engine + HTTP range streaming server)"
license = "MIT"
repository = "https://github.com/AzizBahloul/local-real-debrid-alternative"
keywords = ["bittorrent", "stremio", "streaming", "torrent", "http"]
categories = ["network-programming", "multimedia"]

[lib]
name = "streaming_gateway"
path = "src/lib.rs"

[[bin]]
name = "streaming-gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "time", "sync"] }
axum = { version = "0.8", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
# default-tls pulls in OpenSSL (via librqbit-core's sha1-crypto-hash feature,
# through the `crypto-hash`/`openssl-sys` crates) which needs system
# pkg-config + libssl-dev. rust-tls swaps both the HTTP client and the SHA1
# backend for pure-Rust implementations (rustls + ring), so the whole binary
# builds with just `cargo build` on a bare Ubuntu box -- no system TLS libs.
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
local-ip-address = "0.6"
clap = { version = "4", features = ["derive", "env"] }
sysinfo = "0.33"
tokio-util = { version = "0.7", features = ["io"] }
# Lets the video response body be written as ordinary async code. The body has
# to recover from a stalled torrent read mid-stream (re-opening the underlying
# stream without the player noticing), which is painful to express as a
# hand-written `Stream`/`AsyncRead` state machine.
async-stream = "0.3"
urlencoding = "2"
# Used only to query the torrent index over HTTPS. `rustls` here resolves to
# the same aws-lc-rs provider librqbit already pulls in, so this adds no second
# TLS stack and keeps the zero-OpenSSL property described above.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
